<!-- Organization Schema Markup - Add to every page header -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Online Hoster",
  "url": "https://onlinehoster.nl",
  "logo": "https://onlinehoster.nl/logo.png",
  "sameAs": [
    "https://www.facebook.com/onlinehoster",
    "https://twitter.com/onlinehoster",
    "https://www.linkedin.com/company/online-hoster"
  ],
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "Sales",
    "email": "Sales@onlinehoster.nl"
  },
  "telephone": "+31-70-XXXXXXX"
}
</script>

<!-- Local Business Schema - Add to homepage -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "Online Hoster",
  "image": "https://onlinehoster.nl/logo.png",
  "description": "Professional web hosting solutions in the Netherlands",
  "url": "https://onlinehoster.nl",
  "telephone": "+31-70-XXXXXXX",
  "email": "Support@onlinehoster.nl",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "[Your Street Address]",
    "addressLocality": "[Your City]",
    "postalCode": "[Postal Code]",
    "addressCountry": "NL"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": "[latitude]",
    "longitude": "[longitude]"
  },
  "openingHoursSpecification": {
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
    "opens": "09:00",
    "closes": "17:30"
  }
}
</script>

<!-- Product Schema - For hosting plans -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",

  "description": "Professional shared hosting with 99.9% uptime guarantee",
  "url": "https://onlinehoster.nl/shared-hosting.php",
  "image": "https://onlinehoster.nl/images/shared-hosting.jpg",
  "brand": {
    "@type": "Brand",
    "name": "Online Hoster"
  },
  "offers": {
    "@type": "Offer",
    "price": "[price]",
    "priceCurrency": "EUR",
    "availability": "https://schema.org/InStock",
    "url": "https://onlinehoster.nl/shared-hosting.php"
  },
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "4.8",
    "reviewCount": "[number of reviews]"
  }
}
</script>
